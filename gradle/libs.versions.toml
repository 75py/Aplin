[versions]
# sdk
compileSdk = "36"
minSdk = "26"
targetSdk = "36"
javaVersion = "17"

# plugins
ossLicensesPlugin = "0.10.6"
androidGradlePlugin = "8.13.2"
kotlinAndroidPlugin = "2.3.21"
ktlintPlugin = "14.2.0"
koverPlugin = "0.9.9"

# libraries
kotlin = "2.3.21"
ktx = "1.18.0"
composeUi = "1.11.4"
composeMaterial = "1.11.4"
composeMaterialIcons = "1.7.8"
composeToolingPreview = "1.11.4"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestUiautomator = "2.4.0"
koinAndroid = "4.2.2"
kotlinReflect = "2.3.21"
logcat = "0.4"
navigationCompose = "2.9.8"
ossLicensesPluginVersion = "0.10.6"
playServicesOssLicenses = "17.1.0"
appcompat = "1.7.1"
playServicesAds = "23.5.0"
ump = "3.1.0"
preferenceKtx = "1.2.1"
mockk = "1.14.11"
mockkAndroid = "1.14.11"
